# Robô do painel: quando o portal envia planilhas novas (pasta entradas/), gera e publica o painel.
# Copiado para .github/workflows/atualizar.yml pelo publicar.py; edite o original em _fonte/robo_atualizar.yml.
name: Atualizar painel

on:
  push:
    branches: [main]
    paths: ['entradas/**', 'robo/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: robo-painel
  cancel-in-progress: true

jobs:
  atualizar:
    if: ${{ !contains(github.event.head_commit.message, '[skip robo]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar componentes
        run: pip install --quiet openpyxl cryptography

      - name: Gerar o painel
        env:
          PAINEL_CHAVE_PRIVADA: ${{ secrets.PAINEL_CHAVE_PRIVADA }}
        run: python -W ignore robo/robo.py

      - name: Publicar
        run: |
          git config user.name "Robo do painel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Nada mudou no painel."; exit 0; fi
          git commit -q -m "Painel atualizado pelo robo [skip robo]"
          git pull -q --rebase origin main
          git push -q origin main
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          echo "Painel publicado."
